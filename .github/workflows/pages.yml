name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SSG_VERSION: "0.0.69"
  # SHA-256 of ssg-v0.0.69-x86_64-unknown-linux-musl.tar.gz, as published
  # with the release; the build stops if the download differs.
  SSG_SHA256: "a8b1bd72bc607a58ddb57299fac0107da6cc5b08ed4723b79b8f337f0248ba46"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # post-build.py dates the sitemap by the last commit.
          fetch-depth: 1

      - name: Install ssg
        run: |
          archive="ssg-v${SSG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "$archive" "https://github.com/sebastienrousseau/static-site-generator/releases/download/v${SSG_VERSION}/${archive}"
          echo "${SSG_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf "$archive" -C "$HOME/.local/bin" ssg
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build site
        run: make build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
